<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcel Rittau – Portfolio</title>
<meta name="description" content="Hallöchen :) Schön, dass ihr mich gefunden habt! Ich bin Marcel Rittau, Grafikdesigner aus Köln. Hier gibt es einen Einblick in meine Arbeiten.">
<meta name="author" content="Marcel Rittau">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23151412'/%3E%3Ccircle cx='50' cy='50' r='20' fill='%23CDF443'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#F3EEE3; --paper-2:#E9E2D2; --paper-3:#DED5C1; --field:#FBF8F1;
  --ink:#151412; --ink-2:#4A463E; --ink-3:#6E685C;
  --lime:#CDF443; --lav:#BCA9F7; --pink:#FFA6D0; --orange:#FF6B1A;
  --err:#8A1500; --err-bg:#FFD9E9; --ok:#1F5A00;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --rule:1px solid var(--ink);
  --hair:1px solid var(--paper-3);
  --gut:32px; --max:1440px; --col:24px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
p{margin:0}
h1,h2,h3{margin:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px var(--lime)}
[tabindex="-1"]:focus{outline:none;box-shadow:none}
.skip{position:absolute;left:-999px;top:8px;z-index:30;background:var(--lime);padding:8px 12px;border:var(--rule)}
.skip:focus{left:8px}
.mono{font-family:var(--mono)}

/* ---------- Raster ---------- */
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--col)}
.label{font:500 11px/1.35 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.label b{font-weight:500;color:var(--ink)}
.hint{margin-top:6px;font-size:13px;color:var(--ink-2)}

/* ---------- Bedienelemente ---------- */
.btn{appearance:none;border:var(--rule);background:transparent;border-radius:99px;padding:8px 15px;font:600 13.5px/1.1 var(--sans);color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.btn:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover:not(:disabled){background:#2c2a26}
.btn.lime{background:var(--lime)} .btn.lime:hover:not(:disabled){background:#BCE52E;color:var(--ink)}
.btn.small{padding:5px 11px;font-size:12.5px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:0;font:inherit;font-size:12.5px;text-decoration:underline;text-underline-offset:2px;color:var(--ink-2);cursor:pointer}
.tagline{font:500 11.5px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.tag{display:inline-block;font:600 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:4px 7px;border-radius:99px;border:1px solid var(--ink);white-space:nowrap}
.tag.lime{background:var(--lime)}
.note{padding:10px 12px;border-left:3px solid var(--ink);background:var(--field);font-size:12.8px;color:var(--ink-2)}
.error{padding:10px 12px;border-left:3px solid var(--err);background:var(--err-bg);color:var(--err);font-weight:600;font-size:13px}
input[type=password]{width:100%;max-width:320px;padding:10px 12px;border:var(--rule);border-radius:0;background:var(--field);font:14px var(--mono);color:var(--ink)}

/* ---------- Kopf ---------- */
.top{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:var(--rule)}
.topin{display:flex;align-items:stretch;justify-content:space-between;min-height:60px}
.brand{display:flex;align-items:center;padding:10px 0;text-decoration:none}
.brand img{display:block;height:34px;width:auto}
.brand .wm{display:none;font:700 18px/1 var(--sans);letter-spacing:-.03em}
.brand.noimg img{display:none} .brand.noimg .wm{display:block}
.nav{display:flex;align-items:stretch}
.nav a{display:flex;align-items:center;gap:8px;padding:0 16px;border-left:var(--rule);text-decoration:none;font:500 13.5px/1 var(--sans);transition:background .15s}
.nav a:last-child{border-right:var(--rule)}
.nav a .n{font:500 10.5px/1 var(--mono);color:var(--ink-3)}
.nav a:hover{background:var(--paper-2)}
.nav a[aria-current=page]{background:var(--ink);color:var(--paper)}
.nav a[aria-current=page] .n{color:var(--paper-3)}
.nav .lock{font:500 10.5px/1 var(--mono);color:var(--ink-3)}
.nav a[aria-current=page] .lock{color:var(--paper-3)}

/* ---------- Seitenkopf ---------- */
main{min-height:70vh}
.hero{padding-top:72px;padding-bottom:88px;row-gap:18px}
.hero .side{grid-column:1/4;display:flex;flex-direction:column;gap:6px;padding-top:10px}
.statement{grid-column:4/13;font:500 clamp(30px,3.7vw,58px)/1.04 var(--sans);letter-spacing:-.035em}
.statement .soft{color:var(--ink-3)}
.ptitle{font:500 clamp(40px,5.6vw,88px)/.95 var(--sans);letter-spacing:-.045em}
.phead{padding-top:56px;padding-bottom:56px;row-gap:16px;align-items:end}
.phead .ptitle{grid-column:1/9}
.phead .lead{grid-column:9/13;font-size:15px;color:var(--ink-2);max-width:42ch}
.shrow{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:var(--rule);padding:10px 0}
.filters{display:flex;flex-wrap:wrap;gap:2px}
.fbtn{appearance:none;border:0;background:none;padding:4px 8px;font:500 11px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);cursor:pointer}
.fbtn:hover{color:var(--ink)}
.fbtn[aria-pressed=true]{background:var(--ink);color:var(--paper)}

/* ---------- Projektliste ---------- */
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:var(--rule)}
.prow{display:grid;grid-template-columns:minmax(0,68fr) minmax(0,32fr);column-gap:20px;padding:22px 0 26px;border-top:var(--rule);text-decoration:none;align-items:stretch}
.plist .prow:nth-child(odd){padding-right:var(--col)}
.plist .prow:nth-child(even){padding-left:var(--col);border-left:var(--rule)}
.prow .pimg{container-type:inline-size;align-self:start}
.prow .pimg .media{aspect-ratio:auto;background:none;overflow:visible;display:flex;justify-content:flex-start;align-items:flex-start}
.prow .pimg .media > img,.prow .pimg .kcov img.kstill{position:static;display:block;width:auto;height:auto;max-width:100%;max-height:100cqw;object-fit:contain}
.prow .pimg .kcov{position:relative;display:inline-flex;width:auto}
.prow .pimg .kcov img.kanim{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.prow .pimg .media:not(.loaded):not(:has(> img)){aspect-ratio:1/1;background:var(--paper-2)}
.prow .pimg .kcov:not(.loaded){display:block;width:100%;aspect-ratio:1/1;background:var(--paper-2)}
.prow .pinfo{display:flex;flex-direction:column;gap:12px;min-width:0}
.prow .pnum{display:block;margin-bottom:2px}
.prow h3{font:600 clamp(22px,2vw,30px)/1.05 var(--sans);letter-spacing:-.03em}
.prow p{font-size:14.5px;color:var(--ink-2);max-width:38ch}
.pmeta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:6px 0 0;font:12px/1.4 var(--mono)}
.pmeta dt{color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-size:11px}
.pmeta dd{margin:0}
.more{margin-top:auto;font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;display:inline-flex;gap:8px;align-items:center}
.more i{font-style:normal;transition:transform .15s}
.prow:hover h3{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.prow:hover .more i{transform:translateX(4px)}
.media{position:relative;aspect-ratio:16/10;background:var(--paper-2);overflow:hidden}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:grid;place-items:center}
.ph svg{position:absolute;inset:0;width:100%;height:100%}
.ph .lbl{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:10px}
.ph .lbl b{font:500 10.5px/1 var(--mono);letter-spacing:.06em;padding:4px 7px;border:1px dashed var(--ink-3);color:var(--ink-3)}
.ph .lbl i{font:400 11px/1.3 var(--mono);font-style:normal;color:var(--ink-3)}
.empty{padding:40px 0;border-top:var(--rule)}

/* ---------- Kunden-Kacheln ---------- */
.kcov img.kstill,.kcov img.kanim{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kcov img.kstill{opacity:.4;filter:grayscale(.3);transition:opacity .2s,filter .2s}
.kcov .kover{position:absolute;inset:0;display:grid;place-items:center;padding:22px;transition:opacity .2s}
.kcov .kname{font:600 clamp(22px,2.2vw,34px)/1 var(--sans);letter-spacing:-.035em;text-align:center;color:var(--ink);background:var(--paper);padding:10px 16px 12px;border:var(--rule)}
.kcov .klogo{max-width:58%;max-height:42%;object-fit:contain;display:block}
.kcov .klogo img{max-width:100%;max-height:100%;display:block}
.prow.playing .kcov img.kstill,.prow:hover .kcov img.kstill{opacity:1;filter:none}
.prow.playing .kcov .kover,.prow:hover .kcov .kover{opacity:0}
.unlockbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;flex-wrap:wrap}

/* ---------- Detail ---------- */
.dnav{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 0;border-bottom:var(--hair)}
.dnav a{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;text-decoration:none}
.dnav a:hover{text-decoration:underline}
.dhero{padding-top:56px;padding-bottom:40px;row-gap:16px}
.dhero .ptitle{grid-column:1/11}
.dhero .sub{grid-column:1/8;font:500 clamp(18px,1.6vw,23px)/1.3 var(--sans);letter-spacing:-.015em;color:var(--ink-2)}
.dmeta{border-top:var(--rule);border-bottom:var(--rule);padding:14px 0 16px;row-gap:14px;margin:0}
.dmeta > div{grid-column:span 3;display:flex;flex-direction:column;gap:6px;min-width:0}
.dmeta dt{font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.dmeta dd{margin:0;font-size:14px;line-height:1.4}
.flow{padding-top:16px;padding-bottom:40px}
.flow > *{margin-top:64px}
.txt{align-items:start}
.txt .tl{grid-column:1/4;padding-top:4px}
.txt .tb{grid-column:4/11}
.txt .tb p{font-size:17px;line-height:1.55;max-width:64ch}
.txt .tb p + p{margin-top:12px}
.txt .tb a{text-underline-offset:2px}
.credits{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 24px;margin:0;font:13px/1.4 var(--mono)}
.credits dt{color:var(--ink-3)} .credits dd{margin:0}
.credits dt.ch{grid-column:1/-1;font:600 15px/1 var(--sans);color:var(--ink);margin-top:18px;padding-bottom:6px;border-bottom:var(--hair)}
.credits dt.ch:first-child{margin-top:0}
.mod{display:flex;flex-direction:column;gap:12px;margin-left:calc((100% - 11*var(--col))/12*3 + 3*var(--col))}
.mrow{display:flex;gap:12px;justify-content:center;align-items:flex-start}
.mrow figure{margin:0;flex:0 1 auto;min-width:0}
.zoom{all:unset;display:block;width:100%;cursor:zoom-in}
.zoom:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.zoom img{display:block;width:100%;height:auto}
.zoom .media{aspect-ratio:auto;min-height:140px}
.zoom .media.done{min-height:0;background:none}
.zoom .media.done img{position:static;display:block;width:100%;height:auto}
.emb{aspect-ratio:16/9;max-height:82vh;width:auto;margin-left:calc((100% - 11*var(--col))/12*3 + 3*var(--col));background:var(--paper-2);display:grid;place-items:center;position:relative;border:var(--hair)}
.emb.on{background:#111;border-color:#111}
.emb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.embph{display:flex;flex-direction:column;gap:12px;align-items:flex-start;max-width:46ch;padding:24px}
.embph .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pn{display:grid;grid-template-columns:1fr 1fr;border-top:var(--rule)}
.pn a{display:flex;flex-direction:column;gap:8px;padding:22px 0 30px;text-decoration:none}
.pn a + a{text-align:right;align-items:flex-end;border-left:var(--rule);padding-left:var(--col)}
.pn a b{font:600 clamp(20px,2vw,28px)/1.05 var(--sans);letter-spacing:-.03em}
.pn a:hover b{text-decoration:underline;text-underline-offset:4px}

/* ---------- Großansicht ---------- */
dialog#lb{border:var(--rule);border-radius:0;background:var(--paper);color:var(--ink);padding:0;width:min(96vw,1600px);height:92vh;max-height:92vh;overflow:hidden}
dialog#lb[open]{display:flex;flex-direction:column}
dialog#lb::backdrop{background:rgba(21,20,18,.55)}
.lbbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:var(--rule);flex-wrap:wrap;font-size:12.5px}
.lbbtns{display:flex;gap:6px;flex-wrap:wrap}
.lbstage{flex:1;min-height:0;display:grid;place-items:center;background:var(--paper-2);overflow:auto}
.lbstage img{max-width:100%;max-height:100%;object-fit:contain;display:block}
dialog#lb.full .lbstage{place-items:start}
dialog#lb.full .lbstage img{max-width:none;max-height:none}

/* ---------- Kundenbereich: Schloss ---------- */
.gate{border-top:var(--rule);padding-top:22px;padding-bottom:80px;align-items:start}
.gate .tl{grid-column:1/4}
.gate form{grid-column:4/10;display:flex;flex-direction:column;gap:12px}
.gate .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Tools ---------- */
.trow{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--col);padding:22px 0 26px;border-top:var(--rule);align-items:start}
.trow .num{grid-column:1/2}
.trow .thead{grid-column:2/5;display:flex;flex-direction:column;gap:8px}
.trow h3{font:600 clamp(20px,1.8vw,26px)/1.1 var(--sans);letter-spacing:-.03em}
.trow .tbody{grid-column:5/10;display:flex;flex-direction:column;gap:12px}
.trow .tbody p{color:var(--ink-2);max-width:60ch}
.trow .tact{grid-column:10/13;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.facts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font:12px/1.4 var(--mono);color:var(--ink)}
.facts li{padding-top:4px;border-top:var(--hair)}
.embed{grid-column:1/-1;margin-top:20px}
.embed iframe{display:block;width:100%;height:min(80vh,820px);border:var(--rule);background:var(--field)}
.tlist{border-bottom:var(--rule);margin-bottom:24px}
.tgroup{padding-top:40px}

/* ---------- Über mich / Kontakt ---------- */
.about{border-top:var(--rule);padding-top:22px;padding-bottom:64px;align-items:start;row-gap:28px}
.about .tl{grid-column:1/4}
.about .prose{grid-column:4/10}
.about .prose p{font-size:19px;line-height:1.5;letter-spacing:-.005em}
.about .prose p + p{margin-top:14px}
.bigmail{font:500 clamp(28px,4.6vw,72px)/1 var(--sans);letter-spacing:-.04em;text-decoration:underline;text-underline-offset:8px;text-decoration-thickness:2px;overflow-wrap:anywhere}
.contact{grid-column:4/13;display:flex;flex-direction:column;gap:22px}
.contact .row{display:flex;gap:8px;flex-wrap:wrap}
.status{font:12.5px/1.4 var(--mono);color:var(--ink-2);min-height:1.4em}
.status.ok{color:var(--ok)} .status.bad{color:var(--err)}

/* ---------- Fuß ---------- */
footer{border-top:var(--rule);margin-top:40px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding-top:16px;padding-bottom:22px;font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
footer nav{display:flex;gap:16px}
footer a{color:var(--ink-2);text-decoration:none} footer a:hover{text-decoration:underline}


/* ---------- Formen im Stil des Logos ---------- */
.blob{display:inline-block;color:var(--ink);overflow:visible}
.blob.drag{cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.blob.drag.grabbing{cursor:grabbing}
.b-hero{width:min(100%,220px);height:auto;margin-top:28px}
.b-title{height:.62em;width:auto;vertical-align:baseline;margin-left:.08em;transform-origin:50% 100%}
.b-gate{display:block;width:min(100%,180px);height:auto;margin-top:22px}
.b-arrow{width:20px;height:auto;vertical-align:middle}
.more i{display:inline-flex}
.endmark{display:flex;justify-content:center;padding:24px 0 8px}
.b-end{width:44px;height:auto}
@media (max-width:760px){ .b-hero{width:140px;margin-top:16px} }


/* ---------- Startseite ---------- */
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;padding:14px 0 0}
.sfig{display:flex;flex-direction:column;gap:8px;text-decoration:none}
.sfig img{display:block;width:100%;height:auto;background:var(--paper-2)}
.sfig:hover .label b{text-decoration:underline;text-underline-offset:3px}
.sec{padding-top:96px}
.secbody{padding-top:22px;align-items:start;row-gap:24px}
.secbody .tl{grid-column:1/4}
.intro{font-size:15px;color:var(--ink-2);max-width:30ch}
a.label.more{text-decoration:none;display:inline-flex;gap:8px;align-items:center}
a.label.more:hover{color:var(--ink)}
.ilist,.tsum{grid-column:4/13;list-style:none;margin:0;padding:0;border-top:var(--hair)}
.ilist li a,.tsum li a{display:grid;grid-template-columns:56px minmax(0,1fr) auto 28px;gap:16px;align-items:baseline;padding:14px 0 13px;border-bottom:var(--hair);text-decoration:none}
.ilist b,.tsum b{font:500 clamp(20px,2vw,30px)/1.05 var(--sans);letter-spacing:-.03em}
.ib{font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:right}
.ia{display:flex;justify-content:flex-end;opacity:0;transition:opacity .15s}
.ilist a:hover .ia,.ilist a:focus-visible .ia{opacity:1}
.ilist a:hover b,.tsum a:hover b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.tsum li a{grid-template-columns:56px minmax(0,1fr) auto}
.klist{grid-column:4/9;list-style:none;margin:0;padding:0;border-top:var(--hair)}
.klist li{font:500 clamp(20px,2vw,30px)/1.05 var(--sans);letter-spacing:-.03em;padding:14px 0 13px;border-bottom:var(--hair)}
.kfig{grid-column:9/13;margin:0;display:flex;flex-direction:column;gap:8px}
.kfig img{display:block;width:100%;height:auto}
.quote{grid-column:4/12;display:flex;flex-direction:column;gap:18px}
.qbig{font:500 clamp(26px,3vw,46px)/1.08 var(--sans);letter-spacing:-.035em}
.qsmall{font-size:17px;line-height:1.55;color:var(--ink-2);max-width:56ch}
.b-side{width:min(100%,180px);height:auto}
.hoverprev{position:fixed;left:0;top:0;z-index:20;width:240px;pointer-events:none;opacity:0;transition:opacity .15s}
.hoverprev.on{opacity:1}
.hoverprev img{display:block;width:100%;height:auto}
@media (max-width:1100px){
  .strip{grid-template-columns:repeat(3,minmax(0,1fr))}
  .klist{grid-column:4/13} .kfig{grid-column:4/10}
  .quote{grid-column:4/13}
}
@media (max-width:760px){
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sec{padding-top:64px}
  .secbody .tl,.ilist,.tsum,.klist,.kfig,.quote{grid-column:1/-1}
  .ilist li a{grid-template-columns:40px minmax(0,1fr)} .ilist .ib,.ilist .ia{display:none}
  .tsum li a{grid-template-columns:40px minmax(0,1fr)} .tsum .ib{display:none}
  .b-side{width:120px}
}

/* ---------- Breakpoints ---------- */
@media (max-width:1100px){
  :root{--gut:24px;--col:18px}
  .plist{grid-template-columns:minmax(0,1fr)}
  .plist .prow:nth-child(n){padding-left:0;padding-right:0;border-left:0}
  .prow{grid-template-columns:minmax(0,52fr) minmax(0,48fr);column-gap:var(--col)}
  .txt .tb{grid-column:4/13}
  .dmeta > div{grid-column:span 6}

const Goo = (() => {
  const items = new Set(); let mouse = null, raf = 0;
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  function parse(d){ const tk = d.match(/[MQZ]|-?\d*\.?\d+/g); const cmds = [], pts = [];

    const vb = svg.viewBox.baseVal, P = parse(path.getAttribute("d"));

      L:[0,0], Lv:[0,0], D:[0,0], Dv:[0,0], g:[cx,cy], dragging:false, canDrag: svg.classList.contains("drag")};

    if (it.canDrag){
      svg.addEventListener("pointerdown", e => {
        e.preventDefault(); svg.setPointerCapture(e.pointerId); svg.classList.add("grabbing");
        const q = local(it, e.clientX, e.clientY); it.g = q; it.start = q; it.dragging = true; kick();
      });
      const end = e => { if (!it.dragging) return; it.dragging = false; svg.classList.remove("grabbing"); kick(); };
      svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
      svg.addEventListener("pointermove", e => { if (!it.dragging) return; const q = local(it, e.clientX, e.clientY);
        let dx = q[0]-it.start[0], dy = q[1]-it.start[1]; const m = Math.hypot(dx,dy), lim = it.size*.55;
        const f = 1/(1+m/lim); it.D = [dx*f, dy*f]; it.Dv = [0,0]; kick(); });

    raf = 0; let busy = false;
    for (const it of items){
      if (!it.svg.isConnected){ items.delete(it); continue; }
      const r = it.svg.getBoundingClientRect(); if (r.bottom < -50 || r.top > innerHeight+50) continue;
      // Ziel fürs Neigen: Richtung Cursor, stärker je näher
      let tx = 0, ty = 0, dir = [0,0];
      if (mouse && !still.matches && !it.dragging){
        const q = local(it, mouse[0], mouse[1]); const dx = q[0]-it.cx, dy = q[1]-it.cy, dl = Math.hypot(dx,dy)||1;
        const px = Math.hypot(mouse[0]-(r.left+r.width/2), mouse[1]-(r.top+r.height/2));

const encCache = new Map();
function encBox(ref, i, alt){
  return `<div class="media enc" data-f="${esc(ref.f)}" data-t="${esc(ref.t)}" data-alt="${esc(alt)}">${placeholder(i, "verschlüsselt · lädt …")}</div>`;

async function decryptFile(ref){
  if (encCache.has(ref.f)) return encCache.get(ref.f);
  const pr = (async () => {
    const r = await fetch("kunden/" + ref.f);
    if (!r.ok) throw new Error("http " + r.status);
    const buf = new Uint8Array(await r.arrayBuffer());
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:buf.slice(0,12)}, CK, buf.slice(12));
    return URL.createObjectURL(new Blob([plain], {type:ref.t}));
  })();
  encCache.set(ref.f, pr);
  pr.catch(()=>encCache.delete(ref.f));
  return pr;
}
const encObs = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ encObs.unobserve(e.target); loadEnc(e.target); } }), {rootMargin:"600px"}) : null;
async function loadEnc(el){
  try {
    const url = await decryptFile({f:el.dataset.f, t:el.dataset.t});
    const im = document.createElement("img"); im.alt = el.dataset.alt; im.src = url;
    el.classList.add("done"); el.innerHTML = ""; el.appendChild(im);
  } catch(e){
    const lbl = el.querySelector(".lbl i");
    if (lbl) lbl.textContent = location.protocol==="file:" ? "lädt nur über einen Webserver" : "konnte nicht geladen werden";
  }
}

/* ---------- Kunden ---------- */
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function decryptKunden(pw){
  const E = window.KUNDEN_ENC;
  if (!E) throw Object.assign(new Error("missing"),{code:"missing"});
  if (!crypto?.subtle) throw Object.assign(new Error("nocrypto"),{code:"nocrypto"});
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(E.salt), iterations:E.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  let plain;
  try { plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(E.iv)}, key, b64(E.data)); }
  catch(e){ throw Object.assign(new Error("wrong"),{code:"wrong"}); }
  return JSON.parse(new TextDecoder().decode(plain));
}

async function tryUnlock(pw, silent){

function viewTools(){
  let n = 0, open = false; const parts = [];
  TOOLS.forEach(t => {
    if (t.gruppe){ if (open) parts.push(`</div>`); parts.push(`<div class="tgroup"><div class="shrow"><span class="label"><b>${esc(t.gruppe)}</b></span>${t.sub?`<span class="label">${esc(t.sub)}</span>`:""}</div><div class="tlist">`); open = true; return; }
    n++;
    const acts = t.aktionen.map(a => {
      if (a.typ==="embed") return `<button class="btn primary" type="button" data-embed="${t.id}" aria-expanded="${embedOpen.has(t.id)}" aria-controls="embed-${t.id}">${embedOpen.has(t.id)?"Einbettung schließen":esc(a.label)}</button>`;
      if (a.typ==="link") return `<a class="btn" href="${esc(a.href)}" target="_blank" rel="noopener">${esc(a.label)} ↗</a>`;
      if (a.typ==="datei") return a.href
        ? `<a class="btn" href="${esc(a.href)}" ${/\.html?$/.test(a.href)?'target="_blank" rel="noopener"':'download'}>${esc(a.label)}</a>`
        : `<button class="btn" type="button" disabled title="Noch keine Datei hinterlegt. Trage den Pfad im Feld „href“ ein.">${esc(a.label)}</button>`;
      return "";
    }).join("");
    const datei = t.aktionen.find(a=>a.typ==="datei");
    parts.push(`<article class="trow" id="tool-${t.id}">
      <span class="num label">${pad(n)}/</span>
      <div class="thead"><h3>${esc(t.titel)}</h3><span class="tagline">${t.tags.map(([l])=>esc(l)).join(" · ")}</span></div>
      <div class="tbody">
        <p>${esc(t.text)}</p>
        <ul class="facts">${t.facts.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
        ${t.hinweis?`<p class="hint">${esc(t.hinweis)}</p>`:""}
      </div>
      <div class="tact">${acts}${datei && !datei.href?`<span class="label">Download folgt</span>`:""}</div>
      ${embedOpen.has(t.id)?`<div class="embed" id="embed-${t.id}"><iframe src="${esc(SKINCARE_URL)}" title="${esc(t.titel)} – eingebettet" loading="lazy" referrerpolicy="no-referrer"></iframe></div>`:""}
    </article>`);
  });
  if (open) parts.push(`</div></div>`);
  return `<section class="wrap g12 phead">
      <h2 class="ptitle" id="h-main" tabindex="-1">${esc(TOOLS_NAME)} ${blob("tropfen","b-title drag")}</h2>
      <p class="lead">Werkzeuge, die ich zusammen mit einer KI gebaut habe, Schritt für Schritt aus echten Aufgaben heraus. Keine großen Software-Projekte, sondern Abkürzungen für den Alltag.</p>
    </section>
    <section class="wrap">${parts.join("")}</section>`;
}

/* ---------- Router ---------- */
async function route(){
  const h = decodeURIComponent(location.hash.replace(/^#/,"")) || "start";
  let [sec, slug] = h.split("/");
  if (sec==="werkstatt") sec="tools";
  let html;
  if (sec==="kunden" && !KUNDEN){
    let pw=null; try{ pw=sessionStorage.getItem("mr-kunden"); }catch(e){}
    if (pw) await tryUnlock(pw, true);
  }
  switch(sec){
    case "start": html = viewStart(); break;
    case "arbeiten": html = slug ? viewDetail("arbeiten",slug) : viewArbeiten(); break;
    case "kunden":   html = !KUNDEN ? viewKunden() : (slug ? viewDetail("kunden",slug) : viewKunden()); break;
    case "tools":    html = viewTools(); break;
    case "ueber-mich": html = viewUeber(); break;
    case "kontakt":  html = viewKontakt(); break;
    default: html = viewNotFound(); sec = "";
  }
  renderNav(sec);
  const v = $("view"); v.innerHTML = html;
  document.title = `${({start:"Grafikdesign aus Köln",arbeiten:"Arbeiten",kunden:"Agentur Kunden",tools:TOOLS_NAME,"ueber-mich":"Über mich",kontakt:"Kontakt"})[sec]||"Portfolio"} – Marcel Rittau`;
  wireEnc();
  wireKTiles();
  wire();
  Goo.scan();
}
function focusHead(){ const hh=$("h-main"); if(hh){ hh.focus({preventScroll:true}); } }
function wire(){
  const hp = $("hoverprev");
  if (hp && matchMedia("(hover: hover)").matches){
    const im = hp.querySelector("img");
    document.querySelectorAll("[data-preview]").forEach(a => {
      a.addEventListener("mouseenter", () => { if (!a.dataset.preview) return; im.src = a.dataset.preview; hp.classList.add("on"); });
      a.addEventListener("mouseleave", () => hp.classList.remove("on"));
      a.addEventListener("mousemove", e => { hp.style.transform = `translate(${e.clientX+24}px, ${e.clientY-90}px)`; });
    });
  }
  document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{
    filter=b.dataset.filter; const y=scrollY; route().then(()=>{ scrollTo(0,y); document.querySelector(`[data-filter="${CSS.escape(filter)}"]`)?.focus(); });
  }));
  document.querySelectorAll("[data-embed]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.embed; embedOpen.has(id)?embedOpen.delete(id):embedOpen.add(id);
    const y=scrollY; route().then(()=>{ scrollTo(0,y); document.querySelector(`[data-embed="${id}"]`)?.focus(); });
  }));
  const f=$("gateForm");
  if (f){
    if (gateErr) $("pw").focus();
    f.addEventListener("submit", async e=>{
      e.preventDefault();
      const pw=$("pw").value; const btn=$("gateBtn");
      if (!pw){ $("gateMsg").innerHTML=`<div class="error">Kein Passwort eingegeben. Trag das Passwort ein, das du von mir bekommen hast.</div>`; $("pw").focus(); return; }
      btn.disabled=true; btn.textContent="Entschlüssele …";
      const ok = await tryUnlock(pw);
      await route();
      if (ok) focusHead();
    });
  }
  document.querySelectorAll("[data-zoom]").forEach(b=>b.addEventListener("click",()=>openZoom(+b.dataset.zoom)));
  document.querySelectorAll("[data-load-embed]").forEach(b=>b.addEventListener("click",()=>{
    const box=b.closest(".emb"); const f=document.createElement("iframe");
    f.src=box.dataset.src; f.title="Eingebetteter Inhalt"; f.allow="autoplay; fullscreen; picture-in-picture"; f.allowFullscreen=true;
    box.classList.add("on"); box.innerHTML=""; box.appendChild(f); f.focus();
  }));
  $("lockBtn")?.addEventListener("click",()=>{ KUNDEN=null; CK=null; try{sessionStorage.removeItem("mr-kunden")}catch(e){} route(); });
  $("copyMail")?.addEventListener("click", async ()=>{
    const s=$("copyStatus");
    try{ await navigator.clipboard.writeText(MAIL); s.className="status ok"; s.textContent="Kopiert: "+MAIL; }
    catch(e){ s.className="status bad"; s.textContent="Kopieren hat nicht geklappt, der Browser hat den Zugriff blockiert. Markiere die Adresse oben und kopiere sie selbst."; }
  });
}
(function(){
  const d=$("lb");
  $("lbClose").onclick=()=>d.close();
  $("lbPrev").onclick=()=>openZoom(lbIndex-1);
  $("lbNext").onclick=()=>openZoom(lbIndex+1);
  $("lbFit").onclick=()=>{ d.classList.toggle("full"); $("lbFit").textContent=d.classList.contains("full")?"Eingepasst anzeigen":"1:1 anzeigen"; };
  d.addEventListener("keydown",e=>{ if(e.key==="ArrowLeft") openZoom(lbIndex-1); if(e.key==="ArrowRight") openZoom(lbIndex+1); });
  d.addEventListener("close",()=>{ d.classList.remove("full"); $("lbFit").textContent="1:1 anzeigen"; $("lbImg").removeAttribute("src"); });
})();
addEventListener("hashchange", ()=>{ route().then(()=>{ scrollTo(0,0); focusHead(); }); });
route();
