<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcel Rittau – Portfolio</title>
<meta name="description" content="Hallöchen :) Schön, dass ihr mich gefunden habt! Ich bin Marcel Rittau, Grafikdesigner aus Köln. Hier gibt es einen Einblick in meine Arbeiten.">
<meta name="author" content="Marcel Rittau">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23151412'/%3E%3Ccircle cx='50' cy='50' r='20' fill='%23CDF443'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#F3EEE3; --paper-2:#E9E2D2; --paper-3:#DED5C1; --field:#FBF8F1;
  --ink:#151412; --ink-2:#4A463E; --ink-3:#6E685C;
  --lime:#CDF443; --lav:#BCA9F7; --pink:#FFA6D0; --orange:#FF6B1A;
  --err:#8A1500; --err-bg:#FFD9E9; --ok:#1F5A00;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --rule:1px solid var(--ink);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px var(--lime)}
[tabindex="-1"]:focus{outline:none;box-shadow:none}
h1{margin:0;font-size:clamp(38px,4.4vw,64px);line-height:.86;font-weight:850;letter-spacing:-.055em}
h2{margin:0;font-size:26px;line-height:1;font-weight:800;letter-spacing:-.035em}
h3{margin:0;font-size:21px;line-height:1.05;font-weight:800;letter-spacing:-.03em}
p{margin:0}
.display{font-size:clamp(28px,3.4vw,42px);line-height:.95;font-weight:850;letter-spacing:-.045em;margin:0}
.hint{margin:6px 0 0;font-size:13px;color:var(--ink-2)}
.subhead{font:700 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.sec-n{font:700 12px/1 var(--mono);display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);flex:none}
.mono{font-family:var(--mono)}
.skip{position:absolute;left:-999px;top:8px;z-index:20;background:var(--lime);padding:8px 12px;border:var(--rule);border-radius:99px}
.skip:focus{left:8px}

.btn{appearance:none;border:var(--rule);background:var(--paper);border-radius:99px;padding:9px 16px;font:650 14px/1.1 var(--sans);color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.btn:hover:not(:disabled){background:var(--paper-2)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover:not(:disabled){background:#2c2a26}
.btn.lime{background:var(--lime)} .btn.lime:hover:not(:disabled){background:#BCE52E}
.btn.small{padding:5px 10px;font-size:12.5px}
.btn:disabled,.btn[aria-disabled=true]{opacity:.42;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:0;font:inherit;font-size:12.5px;text-decoration:underline;text-underline-offset:2px;color:var(--ink-2);cursor:pointer}

.tag{display:inline-block;font:700 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:4px 7px;border-radius:99px;border:1px solid var(--ink);white-space:nowrap}
.tag.lime{background:var(--lime)} .tag.lav{background:var(--lav)} .tag.pink{background:var(--pink)}
.tag.org{background:var(--orange);color:#000} .tag.ink{background:var(--ink);color:var(--paper)}
.tags{display:flex;flex-wrap:wrap;gap:5px}

.note{padding:10px 12px;border-left:4px solid var(--orange);background:#FBF6EC;font-size:12.8px;color:var(--ink-2)}
.error{padding:10px 12px;border-left:4px solid var(--err);background:var(--err-bg);color:var(--err);font-weight:600;font-size:13px}
.panel{padding:12px 14px;background:var(--lav);border:var(--rule);border-radius:0 18px 18px 18px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font:12.5px/1.35 var(--mono);margin:0}
.meta dt{color:var(--ink-3)} .meta dd{margin:0}

input[type=password],input[type=text].wide{width:100%;max-width:280px;padding:9px 11px;border:var(--rule);border-radius:8px;background:var(--field);font:14px var(--mono);color:var(--ink)}

/* ---------- Kopf ---------- */
.top{display:grid;grid-template-columns:auto 1fr auto 170px;align-items:stretch;border-bottom:var(--rule)}
.brand{display:flex;align-items:center;padding:18px 22px;text-decoration:none;border-right:var(--rule)}
.brand img{display:block;height:74px;width:auto;max-width:180px;object-fit:contain}
.brand .wm{display:none;font:850 28px/0.9 var(--sans);letter-spacing:-.06em}
.brand.noimg img{display:none} .brand.noimg .wm{display:block}
.name{display:flex;align-items:flex-end;padding:18px 22px}
.claim{align-self:end;padding:18px 22px;font-size:clamp(16px,1.5vw,21px);line-height:1.08;font-weight:700;letter-spacing:-.02em;max-width:30ch}
.claim span{font-weight:500;color:var(--ink-3)}
.deco{border-left:var(--rule);overflow:hidden;min-height:120px}
.deco svg{display:block;width:100%;height:100%}

/* ---------- Navigation ---------- */
.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 22px;border-bottom:var(--rule);position:sticky;top:0;z-index:5;background:var(--paper)}
.nav a{display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border:var(--rule);border-radius:99px;text-decoration:none;font:650 14px/1.1 var(--sans);transition:background .15s}
.nav a .sec-n{width:24px;height:24px;font-size:10.5px}
.nav a:hover{background:var(--paper-2)}
.nav a[aria-current=page]{background:var(--lime)}
.nav .lock{font:600 11px/1 var(--mono);color:var(--ink-3);margin-left:-2px}

/* ---------- Abschnitte ---------- */
main{min-height:60vh}
.intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 40px;align-items:end;padding:34px 22px 26px}
.intro .lead{max-width:42ch;margin-top:14px;color:var(--ink-2)}
.intro .kick{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.filters{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.chip{appearance:none;border:var(--rule);background:var(--paper);border-radius:99px;padding:6px 12px;font:650 13px/1.1 var(--sans);color:var(--ink);cursor:pointer;transition:background .15s}
.chip:hover{background:var(--paper-2)}
.chip[aria-pressed=true]{background:var(--lime)}
.count{font:12.5px/1 var(--mono);color:var(--ink-3);width:100%;text-align:right;margin-top:4px}

/* ---------- Raster ---------- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:var(--rule)}
.tile{display:flex;flex-direction:column;gap:12px;padding:18px 22px 24px;text-decoration:none;border-bottom:var(--rule);border-left:var(--rule);transition:background .15s}
.tile:nth-child(3n+1){border-left:0}
.tile:hover{background:var(--field)}
.tile:hover h3{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.tile .cap{display:flex;align-items:center;gap:8px}
.tile .num{font:600 12px/1 var(--mono);color:var(--ink-3)}
.tile p{font-size:13.5px;color:var(--ink-2);max-width:42ch}
.media{position:relative;aspect-ratio:16/10;background:var(--paper-2);overflow:hidden}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0}
.ph svg{width:100%;height:100%;display:block}
.ph .lbl{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.ph .lbl b{font:700 10.5px/1 var(--mono);letter-spacing:.06em;padding:4px 7px;border:1px dashed var(--ink);border-radius:99px;background:var(--paper)}
.ph .lbl i{font:500 11px/1.2 var(--mono);font-style:normal;color:var(--ink-2);background:var(--paper);padding:2px 5px}
.empty{padding:40px 22px;border-top:var(--rule)}

/* ---------- Detail ---------- */
.dhead{padding:22px 22px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dtitle{padding:26px 22px 28px;border-bottom:var(--rule)}
.dtitle .claim{padding:14px 0 0;max-width:46ch}
.dgrid{display:grid;grid-template-columns:384px minmax(0,1fr)}
.dtext{padding:22px;border-right:var(--rule);display:flex;flex-direction:column;gap:22px}
.dtext .body p{max-width:42ch}
.dtext .body p + p{margin-top:12px}
.gallery{display:grid;gap:0}
.gallery figure{margin:0;border-bottom:var(--rule)}
.gallery figure:last-child{border-bottom:0}
.gallery img{display:block;width:100%;height:auto;background:var(--paper-2)}
.gallery .media{aspect-ratio:16/10}
.pn{display:flex;justify-content:space-between;gap:10px;padding:16px 22px;border-top:var(--rule);flex-wrap:wrap}

/* ---------- Kunden-Schloss ---------- */
.gate{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:var(--rule)}
.gate form{padding:26px 22px;display:flex;flex-direction:column;gap:12px;max-width:520px}
.gate label{font:700 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.gate .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gate .art{border-left:var(--rule);background:var(--paper-2);min-height:280px;position:relative;overflow:hidden}
.gate .art svg{position:absolute;inset:0;width:100%;height:100%}
.unlockbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 22px;border-top:var(--rule);flex-wrap:wrap}

/* ---------- Werkstatt ---------- */
.tools{border-top:var(--rule)}
.group{padding:22px 22px 8px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.trow{display:grid;grid-template-columns:44px 88px minmax(0,1fr) auto;gap:18px;padding:20px 22px;border-top:1px solid var(--paper-3);align-items:start;position:relative}
.group + .trow{border-top:var(--rule)}
.trow.feat::before{content:"";position:absolute;left:0;top:-1px;bottom:0;width:4px;background:var(--lime)}
.trow .num{font:600 12px/30px var(--mono);color:var(--ink-3)}
.ticon{width:88px;height:88px;border:var(--rule);display:grid;place-items:center;background:var(--paper)}
.ticon svg{width:64px;height:64px}
.tbody{display:flex;flex-direction:column;gap:9px;min-width:0}
.tbody p{max-width:62ch;color:var(--ink-2)}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px;font:12.5px/1.35 var(--mono);color:var(--ink)}
.facts li::before{content:"· ";color:var(--ink-3)}
.facts li:first-child::before{content:""}
.tact{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.embed{grid-column:1/-1;margin-top:6px}
.embed iframe{display:block;width:100%;height:min(80vh,820px);border:var(--rule);border-radius:0 18px 18px 18px;background:var(--field)}

/* ---------- Über mich / Kontakt ---------- */
.two{display:grid;grid-template-columns:minmax(0,1fr) 384px;border-top:var(--rule)}
.two > div{padding:22px}
.two > div + div{border-left:var(--rule)}
.prose p{max-width:42ch} .prose p + p{margin-top:12px}
.quote{font-size:clamp(20px,2vw,26px);line-height:1.05;font-weight:800;letter-spacing:-.03em;max-width:22ch}
.contact{position:relative;overflow:hidden;min-height:340px}
.bigmail{display:inline-block;font:600 clamp(18px,2.2vw,28px)/1.1 var(--mono);letter-spacing:-.02em;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;overflow-wrap:anywhere}
.contact .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.status{font:12.5px/1.4 var(--mono);color:var(--ink-2);min-height:1.4em;margin-top:10px}
.status.ok{color:var(--ok)} .status.bad{color:var(--err)}
.corner{position:absolute;right:0;bottom:0;width:170px;height:170px;pointer-events:none}

/* ---------- Fuß ---------- */
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:16px 22px;border-top:var(--rule);font:12.5px/1.3 var(--mono);color:var(--ink-3)}
footer nav{display:flex;gap:16px}
footer a{color:var(--ink-2)}

/* ---------- Detail-Inhalte ---------- */
.dgrid{grid-template-columns:292px minmax(0,1fr)}
.dtext{padding:0;border-right:var(--rule)}
.stick{position:sticky;top:64px;padding:22px;display:flex;flex-direction:column;gap:18px}
.flow{min-width:0}
.flow > * + *{border-top:var(--rule)}
.txt{padding:26px 22px}
.txt p{max-width:62ch;font-size:16px;line-height:1.5}
.txt p + p{margin-top:12px}
.txt a{text-underline-offset:2px}
.imgs{display:grid;gap:1px;background:var(--ink)}
.imgs.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.imgs.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.imgs figure{margin:0;background:var(--paper-2);display:flex;align-items:center;justify-content:center}
.zoom{all:unset;display:block;width:100%;cursor:zoom-in}
.zoom:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
.zoom img{display:block;width:100%;height:auto}
.zoom .media{aspect-ratio:auto;min-height:220px}
.zoom .media.done{min-height:0}
.zoom .media.done img{position:static;display:block;width:100%;height:auto}
.credits{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;margin:0;font:13px/1.4 var(--mono)}
.credits dt{color:var(--ink-3)} .credits dd{margin:0}
.credits dt.ch{grid-column:1/-1;font:800 16px/1 var(--sans);letter-spacing:-.02em;color:var(--ink);margin-top:14px}
.credits dt.ch:first-child{margin-top:0}
.emb{aspect-ratio:16/10;background:var(--paper-2);display:grid;place-items:center;position:relative}
.emb.on{background:#191919}
.emb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.embph{display:flex;flex-direction:column;gap:10px;align-items:flex-start;max-width:44ch;padding:22px}
.embph .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
dialog#lb{border:var(--rule);border-radius:22px 22px 22px 0;background:var(--paper);color:var(--ink);padding:0;width:min(96vw,1600px);height:92vh;max-height:92vh;overflow:hidden}
dialog#lb[open]{display:flex;flex-direction:column}
dialog#lb::backdrop{background:rgba(21,20,18,.42)}
.lbbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:var(--rule);flex-wrap:wrap;font-size:12.5px}
.lbbtns{display:flex;gap:6px;flex-wrap:wrap}
.lbstage{flex:1;min-height:0;display:grid;place-items:center;background:var(--paper-2);overflow:auto}
.lbstage img{max-width:100%;max-height:100%;object-fit:contain;display:block}
dialog#lb.full .lbstage{place-items:start}
dialog#lb.full .lbstage img{max-width:none;max-height:none}
@media (max-width:1100px){ .dgrid{grid-template-columns:minmax(0,1fr)} .stick{position:static} .imgs.c3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:760px){ .imgs.c2,.imgs.c3{grid-template-columns:minmax(0,1fr)} .emb{aspect-ratio:4/5} }


/* ---------- Kunden-Kacheln ---------- */
.kcov img.kstill,.kcov img.kanim{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kcov img.kstill{opacity:.4;filter:grayscale(.2);transition:opacity .15s,filter .15s}
.kcov .kover{position:absolute;inset:0;display:grid;place-items:center;padding:22px;transition:opacity .15s}
.kcov .kname{font-weight:850;font-size:clamp(26px,2.6vw,40px);letter-spacing:-.045em;line-height:.95;text-align:center;color:var(--ink)}
.kcov .klogo{max-width:62%;max-height:46%;object-fit:contain;display:block}
.kcov .klogo img{max-width:100%;max-height:100%;display:block}
.tile.playing .kcov img.kstill{opacity:1;filter:none}
.tile.playing .kcov .kover{opacity:0}
.tile:hover .kcov img.kstill{opacity:1;filter:none}
.tile:hover .kcov .kover{opacity:0}


/* ---------- Bildmodule wie im Original ---------- */
.mod{padding:22px;display:flex;flex-direction:column;gap:8px;max-width:1240px}
.mrow{display:flex;gap:8px;justify-content:center;align-items:flex-start}
.mrow figure{margin:0;flex:none;min-width:0}
.mrow figure:only-child{margin-inline:auto}
.mrow .zoom img{width:100%;height:auto;display:block}
.mrow .zoom .media{min-height:120px;background:var(--paper-2)}
.mrow .zoom .media.done{min-height:0;background:none}
@media (max-width:760px){
  .mrow{flex-wrap:wrap}
  .mrow figure{width:calc(50% - 4px)!important}
  .mrow figure:only-child{width:100%!important}
}

/* ---------- Breakpoints ---------- */
@media (max-width:1100px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile:nth-child(3n+1){border-left:var(--rule)}
  .tile:nth-child(2n+1){border-left:0}
  .dgrid,.two{grid-template-columns:minmax(0,1fr)}
  .dtext{border-right:0;border-bottom:var(--rule)}
  .two > div + div{border-left:0;border-top:var(--rule)}
  .top{grid-template-columns:auto 1fr 120px}
  .top .claim{grid-column:1/-1;border-top:var(--rule);max-width:none}
  .top .deco{grid-row:1;grid-column:3}
}
@media (max-width:760px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .tile{border-left:0!important}
  .intro{grid-template-columns:minmax(0,1fr)}
  .filters{justify-content:flex-start}
  .count{text-align:left}
  .gate{grid-template-columns:minmax(0,1fr)}
  .gate .art{border-left:0;border-top:var(--rule);min-height:160px}
  .trow{grid-template-columns:minmax(0,1fr);gap:12px}
  .trow .num{line-height:1}
  .tact{align-items:flex-start;flex-direction:row;flex-wrap:wrap}
  .top{grid-template-columns:1fr 90px}
  .brand{border-right:0;padding-bottom:0}
  .name{grid-row:2;grid-column:1/-1;padding-top:10px}
  .top .claim{grid-row:3}
  .top .deco{grid-row:1;grid-column:2}
  .brand img{height:56px}
  .nav{padding:10px 14px;overflow-x:auto;flex-wrap:nowrap}
  .nav a{flex:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* =====================================================================
   INHALTE – hier pflegst du die Seite.
   Kachel-Infos stehen hier. Texte, Bilder und Videos der Detailseiten stehen in arbeiten.js
   (übernommen aus dem Adobe-Portfolio, Bilder in bilder/<slug>/).
   ===================================================================== */

const LOGO_FALLBACK = null;

/* Name des Tool-Bereichs – frei änderbar */
const TOOLS_NAME = "Vibe Coded Tools";

const ARBEITEN = [
  { slug:"index", titel:"index", untertitel:"Die App für Jugendsprache.",
    bereiche:["UI/UX"], kontext:"Studienprojekt",

const encCache = new Map();
function encBox(ref, i, alt){
  return `<div class="media enc" data-f="${esc(ref.f)}" data-t="${esc(ref.t)}" data-alt="${esc(alt)}">${placeholder(i, "verschlüsselt · lädt …")}</div>`;

async function decryptFile(ref){
  if (encCache.has(ref.f)) return encCache.get(ref.f);
  const pr = (async () => {
    const r = await fetch("kunden/" + ref.f);
    if (!r.ok) throw new Error("http " + r.status);
    const buf = new Uint8Array(await r.arrayBuffer());
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:buf.slice(0,12)}, CK, buf.slice(12));
    return URL.createObjectURL(new Blob([plain], {type:ref.t}));
  })();
  encCache.set(ref.f, pr);
  pr.catch(()=>encCache.delete(ref.f));
  return pr;
}
const encObs = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ encObs.unobserve(e.target); loadEnc(e.target); } }), {rootMargin:"600px"}) : null;
async function loadEnc(el){
  try {
    const url = await decryptFile({f:el.dataset.f, t:el.dataset.t});
    const im = document.createElement("img"); im.alt = el.dataset.alt; im.src = url;
    el.classList.add("done"); el.innerHTML = ""; el.appendChild(im);
  } catch(e){
    const lbl = el.querySelector(".lbl i");
    if (lbl) lbl.textContent = location.protocol==="file:" ? "lädt nur über einen Webserver" : "konnte nicht geladen werden";
  }
}

const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function decryptKunden(pw){
  const E = window.KUNDEN_ENC;
  if (!E) throw Object.assign(new Error("missing"),{code:"missing"});
  if (!crypto?.subtle) throw Object.assign(new Error("nocrypto"),{code:"nocrypto"});
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(E.salt), iterations:E.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  let plain;
  try { plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(E.iv)}, key, b64(E.data)); }
  catch(e){ throw Object.assign(new Error("wrong"),{code:"wrong"}); }
  return JSON.parse(new TextDecoder().decode(plain));
}

  };

function viewKunden(){
  if (!KUNDEN) return viewKundenGate(gateErr);
  const n = KUNDEN.length;
  return `<section class="intro"><div>
      <div class="kick"><span class="sec-n">02</span><span class="subhead">Agentur Kunden</span><span class="tag lime">Entsperrt</span></div>
      <h2 class="display" id="h-main" tabindex="-1">Für Kund:innen.<br>Nicht für alle.</h2>
      <p class="lead">${n} ${n===1?"Projekt":"Projekte"} aus der Agenturarbeit. Bitte nicht weitergeben.</p>
    </div></section>
  ${location.protocol==="file:"?`<div class="note" style="margin:0 22px 18px">Die Bilder sind einzeln verschlüsselt und laden nur, wenn die Seite über einen Webserver läuft, nicht als lokale Datei.</div>`:""}
  ${n?`<div class="grid">${tiles(KUNDEN,"kunden")}</div>`:`<div class="empty"><p>Noch keine Kundenprojekte eingetragen.</p></div>`}
  <div class="unlockbar"><span class="subhead">Bereich bleibt entsperrt, bis du den Tab schließt</span><button class="linkbtn" type="button" id="lockBtn">Wieder sperren</button></div>`;
}
let gateErr = null;
async function tryUnlock(pw, silent){
  try {
    const data = await decryptKunden(pw);
    KUNDEN = Array.isArray(data) ? data : (data.projekte||[]);
    CK = data.ck ? await crypto.subtle.importKey("raw", b64(data.ck), "AES-GCM", false, ["decrypt"]) : null;
    gateErr = null;
    try{ sessionStorage.setItem("mr-kunden", pw); }catch(e){}
    return true;
  } catch(e){
    if (!silent) gateErr = e.code || "wrong";
    try{ sessionStorage.removeItem("mr-kunden"); }catch(_){}
    return false;
  }
}

function viewTools(){
  let n = 0;
  const rows = TOOLS.map(t => {
    if (t.gruppe) return `<div class="group"><h2>${esc(t.gruppe)}</h2>${t.sub?`<span class="subhead">${esc(t.sub)}</span>`:""}</div>`;
    n++;
    const acts = t.aktionen.map(a => {

      if (a.typ==="link") return `<a class="btn" href="${esc(a.href)}" target="_blank" rel="noopener">${esc(a.label)} ↗</a>`;
      if (a.typ==="datei") return a.href

      return "";
    }).join("");
    const datei = t.aktionen.find(a=>a.typ==="datei");
    return `<article class="trow${t.feat?" feat":""}" id="tool-${t.id}">
      <span class="num">${pad(n)}</span>
      <div class="ticon">${toolIcon(t.icon)}</div>

  return `<section class="intro" style="position:relative">

  <div class="tools">${rows}</div>`;
}

/* ---------- Router ---------- */
async function route(){
  const h = decodeURIComponent(location.hash.replace(/^#/,"")) || "arbeiten";
  let [sec, slug] = h.split("/");
  if (sec==="werkstatt") sec="tools";
  let html;
  if (sec==="kunden" && !KUNDEN){
    let pw=null; try{ pw=sessionStorage.getItem("mr-kunden"); }catch(e){}
    if (pw) await tryUnlock(pw, true);
  }
  switch(sec){
    case "arbeiten": html = slug ? viewDetail("arbeiten",slug) : viewArbeiten(); break;
    case "kunden":   html = !KUNDEN ? viewKunden() : (slug ? viewDetail("kunden",slug) : viewKunden()); break;
    case "tools":    html = viewTools(); break;
    case "ueber-mich": html = viewUeber(); break;
    case "kontakt":  html = viewKontakt(); break;
    default: html = viewNotFound(); sec = "";
  }
  renderNav(sec);
  const v = $("view"); v.innerHTML = html;
  document.title = `${({arbeiten:"Arbeiten",kunden:"Agentur Kunden",tools:TOOLS_NAME,"ueber-mich":"Über mich",kontakt:"Kontakt"})[sec]||"Portfolio"} – Marcel Rittau`;
  wireEnc();
  wireKTiles();
  wire();
}
function focusHead(){ const hh=$("h-main"); if(hh){ hh.focus({preventScroll:true}); } }
function wire(){
  document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{
    filter=b.dataset.filter; const y=scrollY; route().then(()=>{ scrollTo(0,y); document.querySelector(`[data-filter="${CSS.escape(filter)}"]`)?.focus(); });
  }));
  document.querySelectorAll("[data-embed]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.embed; embedOpen.has(id)?embedOpen.delete(id):embedOpen.add(id);
    const y=scrollY; route().then(()=>{ scrollTo(0,y); document.querySelector(`[data-embed="${id}"]`)?.focus(); });
  }));
  const f=$("gateForm");
  if (f){
    if (gateErr) $("pw").focus();
    f.addEventListener("submit", async e=>{
      e.preventDefault();
      const pw=$("pw").value; const btn=$("gateBtn");
      if (!pw){ $("gateMsg").innerHTML=`<div class="error">Kein Passwort eingegeben. Trag das Passwort ein, das du von mir bekommen hast.</div>`; $("pw").focus(); return; }
      btn.disabled=true; btn.textContent="Entschlüssele …";
      const ok = await tryUnlock(pw);
      await route();
      if (ok) focusHead();
    });
  }
  document.querySelectorAll("[data-zoom]").forEach(b=>b.addEventListener("click",()=>openZoom(+b.dataset.zoom)));
  document.querySelectorAll("[data-load-embed]").forEach(b=>b.addEventListener("click",()=>{
    const box=b.closest(".emb"); const f=document.createElement("iframe");
    f.src=box.dataset.src; f.title="Eingebetteter Inhalt"; f.allow="autoplay; fullscreen; picture-in-picture"; f.allowFullscreen=true;
    box.classList.add("on"); box.innerHTML=""; box.appendChild(f); f.focus();
  }));
  $("lockBtn")?.addEventListener("click",()=>{ KUNDEN=null; CK=null; try{sessionStorage.removeItem("mr-kunden")}catch(e){} route(); });
  $("copyMail")?.addEventListener("click", async ()=>{
    const s=$("copyStatus");
    try{ await navigator.clipboard.writeText(MAIL); s.className="status ok"; s.textContent="Kopiert: "+MAIL; }
    catch(e){ s.className="status bad"; s.textContent="Kopieren hat nicht geklappt, der Browser hat den Zugriff blockiert. Markiere die Adresse oben und kopiere sie selbst."; }
  });
}
(function(){
  const d=$("lb");
  $("lbClose").onclick=()=>d.close();
  $("lbPrev").onclick=()=>openZoom(lbIndex-1);
  $("lbNext").onclick=()=>openZoom(lbIndex+1);
  $("lbFit").onclick=()=>{ d.classList.toggle("full"); $("lbFit").textContent=d.classList.contains("full")?"Eingepasst anzeigen":"1:1 anzeigen"; };
  d.addEventListener("keydown",e=>{ if(e.key==="ArrowLeft") openZoom(lbIndex-1); if(e.key==="ArrowRight") openZoom(lbIndex+1); });
  d.addEventListener("close",()=>{ d.classList.remove("full"); $("lbFit").textContent="1:1 anzeigen"; $("lbImg").removeAttribute("src"); });
})();
addEventListener("hashchange", ()=>{ route().then(()=>{ scrollTo(0,0); focusHead(); }); });
route();
